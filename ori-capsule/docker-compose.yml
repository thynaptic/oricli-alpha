services:
  ori-capsule:
    build: .
    image: ori-capsule:local
    ports:
      - "${ORI_CAPSULE_PORT:-8089}:8089"
    environment:
      ORI_CAPSULE_PORT: "8089"
      ORI_DEFAULT_PROVIDER: ${ORI_DEFAULT_PROVIDER:-openai}
      ORI_OPENCODE_BASE_URL: ${ORI_OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      # Optional gateway lock — leave empty for pure BYOK (Bearer = provider key)
      ORI_CAPSULE_KEY: ${ORI_CAPSULE_KEY:-}
    restart: unless-stopped
