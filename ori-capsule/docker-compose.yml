services:
  ori-capsule:
    build: .
    image: ori-capsule:local
    ports:
      - "${ORI_CAPSULE_PORT:-8089}:8089"
    environment:
      ORI_CAPSULE_PORT: "8089"
      ORI_DEFAULT_PROVIDER: ${ORI_DEFAULT_PROVIDER:-openai}
      ORI_OPENCODE_BASE_URL: ${ORI_OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      ORI_CAPSULE_KEY: ${ORI_CAPSULE_KEY:-}
      ORI_MEMORY_DIR: /data/memory
      ORI_MEMORY_ENCRYPTION_KEY: ${ORI_MEMORY_ENCRYPTION_KEY:-}
      ORI_MEMORY_MAX_TURNS: ${ORI_MEMORY_MAX_TURNS:-24}
      # GOSH: overlay on read-only project mount (falls back to mem if unset/missing)
      ORI_GOSH_ENABLED: ${ORI_GOSH_ENABLED:-true}
      ORI_GOSH_WORKSPACE: /workspace
      ORI_GOSH_TIMEOUT_SEC: ${ORI_GOSH_TIMEOUT_SEC:-5}
      # Mount-only overlays (read-only)
      ORI_SKILLS_DIR: /skills
      ORI_AGENTS_DIR: /agents
      # Light JIT forge (ephemeral — not on the memory volume)
      ORI_FORGE_MAX_TOOLS: ${ORI_FORGE_MAX_TOOLS:-16}
      ORI_FORGE_TTL_MIN: ${ORI_FORGE_TTL_MIN:-30}
      # CORS — empty disables; "*" or comma-separated origins
      ORI_CORS_ORIGINS: ${ORI_CORS_ORIGINS:-}
    volumes:
      # Durable: sessions, spaces, tasks, BM25 RAG
      - ori-capsule-memory:/data/memory
      # GOSH host project (read-only overlay)
      - ${ORI_GOSH_HOST_PATH:-.}:/workspace:ro
      # Skills / agents (override host paths as needed)
      - ${ORI_SKILLS_HOST_PATH:-../oricli_core/skills}:/skills:ro
      - ${ORI_AGENTS_HOST_PATH:-../.github/agents}:/agents:ro
    restart: unless-stopped

volumes:
  ori-capsule-memory:
