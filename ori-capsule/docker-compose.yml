services:
  ori-capsule:
    build: .
    image: ori-capsule:local
    ports:
      - "${ORI_CAPSULE_PORT:-8089}:8089"
    environment:
      ORI_CAPSULE_PORT: "8089"
      ORI_DEFAULT_PROVIDER: ${ORI_DEFAULT_PROVIDER:-openai}
      ORI_OPENCODE_BASE_URL: ${ORI_OPENCODE_BASE_URL:-https://opencode.ai/zen/v1}
      ORI_CAPSULE_KEY: ${ORI_CAPSULE_KEY:-}
      ORI_MEMORY_DIR: /data/memory
      ORI_MEMORY_ENCRYPTION_KEY: ${ORI_MEMORY_ENCRYPTION_KEY:-}
      ORI_MEMORY_MAX_TURNS: ${ORI_MEMORY_MAX_TURNS:-24}
      # GOSH: overlay on read-only project mount (falls back to mem if unset/missing)
      ORI_GOSH_ENABLED: ${ORI_GOSH_ENABLED:-true}
      ORI_GOSH_WORKSPACE: /workspace
      ORI_GOSH_TIMEOUT_SEC: ${ORI_GOSH_TIMEOUT_SEC:-5}
    volumes:
      - ori-capsule-memory:/data/memory
      # Mount a host project read-only for GOSH overlay (override path as needed)
      - ${ORI_GOSH_HOST_PATH:-.}:/workspace:ro
    restart: unless-stopped

volumes:
  ori-capsule-memory:
